version: 2
updates:
  # Rust workspace (root Cargo.toml + all member crates).
  - package-ecosystem: cargo
    directory: "/"
    schedule:
      interval: monthly
      time: "06:00"
      timezone: "Etc/UTC"
    open-pull-requests-limit: 10
    cooldown:
      default-days: 7
    commit-message:
      prefix: "deps(cargo)"
    groups:
      # napi-rs (napi / napi-derive / napi-build) is a coordinated major
      # migration that must move with @napi-rs/cli on the npm side — keep it in
      # its own PR rather than bundled with unrelated crate bumps.
      napi:
        patterns: ["napi", "napi-derive", "napi-build"]
      cargo:
        patterns: ["*"]
        exclude-patterns: ["napi", "napi-derive", "napi-build"]

  # The fuzz crate is a detached workspace (cargo-fuzz builds it on its own with
  # sanitizer flags), so the root cargo entry above does not reach it.
  - package-ecosystem: cargo
    directory: "/fuzz"
    schedule:
      interval: monthly
      time: "06:00"
      timezone: "Etc/UTC"
    open-pull-requests-limit: 10
    cooldown:
      default-days: 7
    commit-message:
      prefix: "deps(fuzz)"
    groups:
      fuzz:
        patterns: ["*"]

  # Node binding npm dependencies.
  - package-ecosystem: npm
    directory: "/bindings/node"
    schedule:
      interval: monthly
      time: "06:00"
      timezone: "Etc/UTC"
    open-pull-requests-limit: 10
    cooldown:
      default-days: 7
    commit-message:
      prefix: "deps(npm)"
    groups:
      node-binding:
        patterns: ["*"]

  # Python binding pip dependencies.
  - package-ecosystem: pip
    directory: "/bindings/python"
    schedule:
      interval: monthly
      time: "06:00"
      timezone: "Etc/UTC"
    open-pull-requests-limit: 10
    cooldown:
      default-days: 7
    commit-message:
      prefix: "deps(pip)"
    groups:
      python-binding:
        patterns: ["*"]

  # Hash-pinned CI Python tooling under .github/requirements/. Each <name>.in is
  # the loose source; the matching hash-locked <name>.txt is the output
  # regenerated by scripts/update-lockfiles.sh (uv, which honours each row's
  # target Python via --python-version).
  - package-ecosystem: pip
    directory: "/.github/requirements"
    schedule:
      interval: monthly
      time: "06:00"
      timezone: "Etc/UTC"
    # Version-update pull requests disabled (0). Dependabot edits the .txt
    # directly and does not know which interpreter each lock was resolved
    # against, so a bump lands a version the row cannot install: ci-dev-py39.txt
    # exists precisely because pytest >= 9 and iniconfig >= 2.3 declare
    # requires-python >= 3.10, and a bump there also drops the exceptiongroup and
    # tomli backports 3.9 needs. Regenerate with the script instead.
    #
    # Security updates are exempt from this limit and still arrive, which is what
    # should happen -- they are judged one at a time. The first one (pytest,
    # GHSA-6w46-j5rx-g56g) proposed 9.0.3 for both files: a downgrade for
    # ci-dev-py3.txt, already on 9.1.1, and an impossible install for the 3.9 row.
    open-pull-requests-limit: 0
    cooldown:
      default-days: 7
    commit-message:
      prefix: "deps(ci-pip)"
    groups:
      ci-pip:
        patterns: ["*"]
    # No `ignore` list here, deliberately. The limit above already suppresses
    # every version-update pull request for this ecosystem, so an ignore would
    # add nothing there; its only remaining effect would be on security updates,
    # which are the one thing that should still get through.

  # The runnable examples are what a reader copies from, so their manifests are
  # kept current too.
  - package-ecosystem: npm
    directory: "/examples/node"
    schedule:
      interval: monthly
      time: "06:00"
      timezone: "Etc/UTC"
    open-pull-requests-limit: 10
    cooldown:
      default-days: 7
    commit-message:
      prefix: "deps(npm)"
    groups:
      node-example:
        patterns: ["*"]

  - package-ecosystem: gomod
    directory: "/examples/go"
    schedule:
      interval: monthly
      time: "06:00"
      timezone: "Etc/UTC"
    open-pull-requests-limit: 10
    cooldown:
      default-days: 7
    commit-message:
      prefix: "deps(gomod)"
    groups:
      go-example:
        patterns: ["*"]

  # GitHub Actions — keeps the SHA-pinned actions current (Dependabot reads
  # the version comment after each pinned SHA and bumps both together).
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: monthly
      time: "06:00"
      timezone: "Etc/UTC"
    open-pull-requests-limit: 10
    cooldown:
      default-days: 7
    commit-message:
      prefix: "deps(actions)"
    # dtolnay/rust-toolchain@<channel> pins a Rust toolchain (e.g. 1.86 for the
    # MSRV job), not an action version. Dependabot misreads the channel as a
    # version and proposes non-existent Rust releases. The toolchain pins are
    # managed manually with the MSRV policy.
    ignore:
      - dependency-name: "dtolnay/rust-toolchain"
    groups:
      github-actions:
        patterns: ["*"]

  # Java binding (Maven).
  - package-ecosystem: maven
    directory: "/bindings/java"
    schedule:
      interval: monthly
      time: "06:00"
      timezone: "Etc/UTC"
    open-pull-requests-limit: 10
    cooldown:
      default-days: 7
    commit-message:
      prefix: "deps(maven)"
    groups:
      maven:
        patterns: ["*"]

  # C# binding (NuGet). The published wrapper is a thin C-ABI wrapper with no
  # external packages; the test project pulls xunit and Microsoft.NET.Test.Sdk.
  - package-ecosystem: nuget
    directory: "/bindings/csharp/WickraScreener.Tests"
    schedule:
      interval: monthly
      time: "06:00"
      timezone: "Etc/UTC"
    open-pull-requests-limit: 10
    cooldown:
      default-days: 7
    commit-message:
      prefix: "deps(nuget)"
    groups:
      nuget:
        patterns: ["*"]

  # Go binding (Go modules).
  - package-ecosystem: gomod
    directory: "/bindings/go"
    schedule:
      interval: monthly
      time: "06:00"
      timezone: "Etc/UTC"
    open-pull-requests-limit: 10
    cooldown:
      default-days: 7
    commit-message:
      prefix: "deps(gomod)"
    groups:
      go-binding:
        patterns: ["*"]
