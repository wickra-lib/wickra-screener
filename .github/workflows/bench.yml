name: Benchmark

# The Criterion benchmark adds several minutes of build + bench time with no
# consumer of the resulting artefact, so it runs on a nightly schedule and on
# demand rather than gating every push / PR. ci.yml still verifies build / tests
# / lints on every push and pull-request.
on:
  schedule:
    - cron: "0 3 * * *" # nightly at 03:00 UTC
  workflow_dispatch:

# Least-privilege default: the single job only builds and uploads an artifact.
permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_NET_RETRY: "10"
  CARGO_NET_GIT_FETCH_WITH_CLI: "true"

jobs:
  bench:
    name: Criterion benchmark
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-rust
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      # Both execution paths, because BENCHMARKS.md describes the matrix as
      # covering them and a document that names a measurement nothing takes is
      # the same defect as a missing test. The sequential path is what WASM runs
      # and what `--no-default-features` builds; a scan must produce a
      # byte-identical report either way, so the interesting number is the cost
      # of that equality, not whether it holds.
      - name: Run the Criterion benchmark (parallel, the default)
        run: |
          echo "=== parallel (rayon, default features) ===" | tee benchmark.txt
          cargo bench -p wickra-screener-bench | tee -a benchmark.txt
      - name: Run the Criterion benchmark (sequential)
        run: |
          echo "" | tee -a benchmark.txt
          echo "=== sequential (--no-default-features, the WASM path) ===" | tee -a benchmark.txt
          cargo bench -p wickra-screener-bench --no-default-features | tee -a benchmark.txt
      - name: Upload report
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: benchmark
          path: benchmark.txt
