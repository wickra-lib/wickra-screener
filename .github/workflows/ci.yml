name: CI

on:
  push:
    branches: [main]
  # Only pull requests that target main. Without the filter a pull request
  # between two topic branches runs the whole matrix twice for a merge nobody
  # is asking for yet.
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test (${{ matrix.os }}, ${{ matrix.features }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        features: ["--all-features", "--no-default-features"]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    # The screener-cli binary (wickra-screener) and the C ABI cdylib
    # (wickra_screener) share a stem on Windows, so building both in one
    # --workspace pass can race on the same .pdb and trip LNK1201. Dropping debug
    # info (tests do not need it) removes the collision and keeps runner disk use
    # down; RUSTFLAGS is part of the cache key.
    env:
      RUSTFLAGS: "-C debuginfo=0"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-rust
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      # The PyO3 extension cdylib is built and tested by the `python` job via
      # maturin; the C ABI cdylib by the `c-abi` job. Exclude both here.
      - run: cargo build --workspace ${{ matrix.features }} --exclude wickra-screener-python --exclude wickra-screener-c
      - run: cargo test --workspace ${{ matrix.features }} --exclude wickra-screener-python --exclude wickra-screener-c

  lint:
    name: Format & Clippy
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-rust
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets --all-features -- -D warnings
      - run: cargo clippy --workspace --all-targets --no-default-features -- -D warnings

  msrv:
    name: MSRV workspace (1.86)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-rust
        with:
          toolchain: "1.86"
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      # The Node binding (napi 3) needs Rust 1.88 and is checked separately; the
      # Python binding needs maturin's platform link flags and is built by the
      # `python` job. The library, CLI, C ABI and WASM stay at 1.86.
      - run: >
          cargo build --workspace
          --exclude wickra-screener-python
          --exclude wickra-screener-node

  msrv-node:
    name: MSRV node (1.88)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-rust
        with:
          toolchain: "1.88"
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - run: cargo build -p wickra-screener-node

  supply-chain:
    name: cargo-deny
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: taiki-e/install-action@742a3317eac7bd62f91cd888b4eead5e784ba833 # v2.87.1
        with:
          tool: cargo-deny
      - run: cargo deny check

  # osv-scanner.toml existed and nothing ran it, so the ignores it carries were
  # documentation rather than policy. cargo-deny reads RustSec; this reads OSV,
  # which also covers the npm, Go, Maven and NuGet manifests the bindings carry.
  osv:
    name: osv-scanner
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: taiki-e/install-action@742a3317eac7bd62f91cd888b4eead5e784ba833 # v2.87.1
        with:
          tool: osv-scanner
      - run: osv-scanner scan source --recursive .

  # Advisory, never blocking. links.yml stays the authoritative run: external
  # link rot is non-deterministic, so a third-party outage must not be able to
  # fail a pull request. But a weekly job means a link this PR breaks is found
  # up to seven days later, by which time it reads as unrelated. This surfaces it
  # now and cannot stop anything -- `continue-on-error` keeps the result visible
  # in the checks list while leaving the conclusion neutral.
  links:
    name: Links (advisory)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    continue-on-error: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: lycheeverse/lychee-action@e7477775783ea5526144ba13e8db5eec57747ce8 # v2.9.0
        with:
          args: --config lychee.toml --no-progress --root-dir "${{ github.workspace }}" "**/*.md"
          fail: true

  # Four static checks that no other job can fail on. Each exists because the
  # thing it guards is invisible to the rest of CI: the golden corpus compares
  # values, so a binding that lost a method has no test to run; a version that
  # disagrees with itself compiles fine and surfaces on a user's machine after an
  # irreversible tag; a relative link in a binding README resolves on GitHub and
  # nowhere else; and a licence text that never travelled is missing only in the
  # published package.
  binding-surface:
    name: Binding surface parity
    runs-on: ubuntu-latest
    timeout-minutes: 10 # static checks; if they are not done in ten minutes they are stuck
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Ten language reaches sit on one C ABI, and each is tested separately.
      # This holds every surface to the header instead.
      - name: Compare every binding's surface with the C ABI
        run: python3 scripts/check_binding_surface.py

      # The version lives in two dozen declarations across six package managers.
      # A bump that misses one ships a package pinning a binary that was never
      # published, and that surfaces on a user's machine after the tag.
      - name: Every version declaration agrees
        run: python3 scripts/check_version_sync.py

      # The binding READMEs are the long descriptions PyPI, NuGet, pkg.go.dev and
      # r-universe render. A repository-relative link resolves on GitHub and is
      # dead on every one of those pages.
      - name: Binding READMEs link absolutely
        run: python3 scripts/check_readme_links.py

      # Cargo decides what to package from git, so a licence copy that is
      # untracked or ignored never reaches the .crate. Committed copies are the
      # only thing that works, and their cost is drift.
      - name: Published packages carry their licence texts
        run: python3 scripts/check_license_copies.py

  coverage:
    name: Coverage
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-rust
        with:
          components: llvm-tools-preview
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@742a3317eac7bd62f91cd888b4eead5e784ba833 # v2.87.1
        with:
          tool: cargo-llvm-cov
      # Measure the core in its sequential (no rayon) configuration — the scan is
      # byte-identical either way, and this keeps coverage deterministic.
      - name: Generate coverage (lcov)
        run: >
          cargo llvm-cov --no-default-features
          -p screener-core
          --lcov --output-path lcov.info
      - name: Upload to Codecov
        uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v7.0.0
        with:
          files: lcov.info
          # An organization-level upload token carries no repository identity,
          # so Codecov cannot route the upload without an explicit slug and
          # falls back to a tokenless upload, which a protected branch rejects.
          slug: ${{ github.repository }}
          fail_ci_if_error: true
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}

  fuzz-smoke:
    name: Fuzz (smoke)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-rust
        with:
          toolchain: nightly
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: fuzz
      - name: Install cargo-fuzz
        uses: taiki-e/install-action@742a3317eac7bd62f91cd888b4eead5e784ba833 # v2.87.1
        with:
          tool: cargo-fuzz
      - name: Fuzz spec_parse (30 s)
        run: cargo +nightly fuzz run --target x86_64-unknown-linux-gnu spec_parse -- -max_total_time=30
        working-directory: fuzz
      - name: Fuzz condition_eval (30 s)
        run: cargo +nightly fuzz run --target x86_64-unknown-linux-gnu condition_eval -- -max_total_time=30
        working-directory: fuzz
      - name: Fuzz scan_batch (30 s)
        run: cargo +nightly fuzz run --target x86_64-unknown-linux-gnu scan_batch -- -max_total_time=30
        working-directory: fuzz
      - name: Fuzz symbol_fold (30 s)
        run: cargo +nightly fuzz run --target x86_64-unknown-linux-gnu symbol_fold -- -max_total_time=30
        working-directory: fuzz
      - name: Fuzz feed_payload (30 s)
        run: cargo +nightly fuzz run --target x86_64-unknown-linux-gnu feed_payload -- -max_total_time=30
        working-directory: fuzz

  # The runnable examples are the first thing a reader copies, and only
  # examples/rust was ever compiled -- it is a workspace member, so cargo built
  # it. The other seven were not built by anything: a change to the JSON surface
  # would have left them broken in the repository with every check green.
  #
  # Each one prints the same report, so each is checked for the same match rather
  # than only for exiting zero. The C and C++ examples are built and run by the
  # `c-abi` job through CMake and ctest, which is where their toolchain already
  # is.
  examples:
    name: Examples
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-rust
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

      - name: Build the C ABI library the non-native bindings link against
        run: cargo build -p wickra-screener-c --release

      - name: Stage the native library for Go and put it on the loader path
        shell: bash
        run: |
          mkdir -p bindings/go/lib/linux_amd64
          cp target/release/libwickra_screener.so bindings/go/lib/linux_amd64/
          echo "LD_LIBRARY_PATH=$PWD/target/release:$LD_LIBRARY_PATH" >> "$GITHUB_ENV"

      # Every example prints the same one-symbol report; this is what each run is
      # checked against, so an example that starts and prints nothing fails.
      - name: Rust
        shell: bash
        run: |
          out=$(cargo run -q -p wickra-screener-example)
          echo "$out"
          echo "$out" | grep -q '"symbol":"BBB"'

      # `maturin develop` wants a virtualenv; the python job builds a wheel and
      # installs it instead, which needs none. Same route here.
      - name: Python
        shell: bash
        run: |
          python -m pip install --upgrade pip
          # Same hash-locked tooling the python job installs. This step uses the
          # runner's own interpreter, which is 3.10+, so the py3 lock applies.
          python -m pip install --require-hashes -r .github/requirements/ci-dev-py3.txt
          ( cd bindings/python && maturin build --release --out dist )
          python -m pip install --no-index --find-links bindings/python/dist wickra-screener
          out=$(python examples/python/scan.py)
          echo "$out"
          echo "$out" | grep -q '"symbol":"BBB"'

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        id: setup_node_examples
        continue-on-error: true
        with:
          node-version: "22"
      - name: Pause before retrying the toolchain download
        if: steps.setup_node_examples.outcome == 'failure'
        run: sleep 30
        shell: bash
      - name: Retry the toolchain download
        if: steps.setup_node_examples.outcome == 'failure'
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
      - name: Node.js
        shell: bash
        run: |
          ( cd bindings/node && npm install --no-audit --no-fund && npx napi build --platform --release )
          ( cd examples/node && npm install --no-audit --no-fund )
          out=$(node examples/node/scan.js)
          echo "$out"
          echo "$out" | grep -q '"symbol":"BBB"'

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.23"
      - name: Go
        shell: bash
        run: |
          out=$(cd examples/go && go run .)
          echo "$out"
          echo "$out" | grep -q '"symbol":"BBB"'

      - uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6.0.0
        with:
          distribution: temurin
          java-version: "22"
      - name: Java
        shell: bash
        run: |
          mvn -f bindings/java/pom.xml -q package -DskipTests
          javac -cp bindings/java/target/classes examples/java/Scan.java -d examples/java/out
          out=$(java --enable-native-access=ALL-UNNAMED \
            -Dnative.lib.dir="$PWD/target/release" \
            -cp "bindings/java/target/classes:examples/java/out" Scan)
          echo "$out"
          echo "$out" | grep -q '"symbol":"BBB"'

      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: "8.0.x"
      - name: C#
        shell: bash
        run: |
          out=$(dotnet run --project examples/csharp/Scan)
          echo "$out"
          echo "$out" | grep -q '"symbol":"BBB"'

      - uses: r-lib/actions/setup-r@465b7d8e732ca3921382b1674c59bada9cbf3399 # v2.13.0
        with:
          use-public-rspm: true
      - name: R
        shell: bash
        env:
          WKSCREEN_INC: ${{ github.workspace }}/bindings/c/include
          WKSCREEN_LIB: ${{ github.workspace }}/target/release
        run: |
          R CMD INSTALL bindings/r
          out=$(Rscript examples/r/scan.R)
          echo "$out"
          echo "$out" | grep -q '"symbol":"BBB"'

  python:
    name: Python ${{ matrix.python-version }} on ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ["3.9", "3.11", "3.12", "3.13"]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # The toolchain download flakes on the Windows runners often enough that a
      # rerun with no code change is the standard fix. One retry costs half a
      # minute; a failed job costs the whole matrix a rerun.
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        id: setup_python
        continue-on-error: true
        with:
          python-version: ${{ matrix.python-version }}
      - name: Pause before retrying the toolchain download
        if: steps.setup_python.outcome == 'failure'
        run: sleep 30
        shell: bash
      - name: Retry the toolchain download
        if: steps.setup_python.outcome == 'failure'
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
      - uses: ./.github/actions/setup-rust
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - name: Install Python dev dependencies
        shell: bash
        run: |
          python -m pip install --upgrade pip
          # Hash-locked dev tooling (OpenSSF Scorecard PinnedDependencies).
          # Split by Python version: pytest >= 9.0 and iniconfig >= 2.3 both
          # declare requires-python >= 3.10, so one resolution cannot serve the
          # 3.9 row and the rest of the matrix.
          if [ "${{ matrix.python-version }}" = "3.9" ]; then
            python -m pip install --require-hashes -r .github/requirements/ci-dev-py39.txt
          else
            python -m pip install --require-hashes -r .github/requirements/ci-dev-py3.txt
          fi
      - run: maturin build --out dist
        working-directory: bindings/python
      - run: pip install --no-index --find-links bindings/python/dist wickra-screener
      - run: pytest bindings/python/tests -q

  # The Linux wheels are built inside manylinux and musllinux containers, and
  # release.yml is the only place that happens -- on a `v*` tag, where a failure
  # is discovered at the one moment nothing can be taken back. The `python` job
  # above builds on the runner itself, which is a different libc, a different
  # toolchain image and a different set of system headers, so it cannot see a
  # container-only break.
  #
  # Unlike the sibling repositories this needs no vendored OpenSSL and no Perl:
  # the Python binding depends on screener-core without the `live` feature, so
  # nothing in the wheel links a TLS stack. If that ever changes, this job is
  # where it will show up first.
  python-wheel-container-smoke:
    name: Python wheel (${{ matrix.manylinux }} smoke)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        manylinux: [auto, musllinux_1_2]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Same invocation release.yml uses for its Linux rows, so what is proven
      # here is what will run there.
      - uses: PyO3/maturin-action@e83996d129638aa358a18fbd1dfb82f0b0fb5d3b # v1.51.0
        with:
          working-directory: bindings/python
          target: x86_64
          args: --release --strip --out dist
          manylinux: ${{ matrix.manylinux }}
      - name: The container produced a wheel
        shell: bash
        run: |
          set -euo pipefail
          ls -l bindings/python/dist
          test "$(find bindings/python/dist -name '*.whl' | wc -l)" -ge 1

  node:
    name: Node ${{ matrix.node-version }} on ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        node-version: ["22", "24"]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-rust
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      # The toolchain download flakes on the Windows runners often enough that a
      # rerun with no code change is the standard fix. One retry costs half a
      # minute; a failed job costs the whole matrix a rerun.
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        id: setup_node
        continue-on-error: true
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
          cache-dependency-path: bindings/node/package-lock.json
      - name: Pause before retrying the toolchain download
        if: steps.setup_node.outcome == 'failure'
        run: sleep 30
        shell: bash
      - name: Retry the toolchain download
        if: steps.setup_node.outcome == 'failure'
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
          cache-dependency-path: bindings/node/package-lock.json
      # npm install (not npm ci): the per-platform optionalDependencies point at
      # native packages that are not published until the first release.
      - name: Install Node dependencies
        run: cd bindings/node && npm install --no-audit --no-fund
      - name: Build native module
        run: cd bindings/node && npx napi build --platform --release
      # The generated glue is platform-independent, so a drift check on one OS is
      # enough — and avoids a spurious CRLF/LF diff on the Windows runner.
      - name: Check index.js / index.d.ts are in sync
        if: runner.os == 'Linux'
        run: cd bindings/node && git diff --exit-code -- index.js index.d.ts
      - name: Run Node tests
        run: cd bindings/node && node --test

  wasm:
    name: WASM
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-rust
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - name: Install wasm-pack
        uses: taiki-e/install-action@742a3317eac7bd62f91cd888b4eead5e784ba833 # v2.87.1
        with:
          tool: wasm-pack
      - name: Build the wasm binding
        run: wasm-pack build --target web
        working-directory: bindings/wasm

      # The job used to stop at the line above: the binding was compiled on
      # every push and executed on none of them, while the README advertises a
      # live in-browser demo and the core documents the sequential WASM path as
      # byte-identical to the parallel one. A second build for node makes the
      # module loadable without a browser; `pkg/` stays what ships.
      - name: Build the wasm binding for node
        run: wasm-pack build --target nodejs --out-dir pkg-node
        working-directory: bindings/wasm
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
      - name: Run the wasm tests
        run: node --test tests/
        working-directory: bindings/wasm

  c-abi:
    name: C ABI on ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-rust
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - name: Install cbindgen
        uses: taiki-e/install-action@742a3317eac7bd62f91cd888b4eead5e784ba833 # v2.87.1
        with:
          tool: cbindgen
      - name: Build the C ABI library (cdylib + staticlib)
        run: cargo build -p wickra-screener-c --release
      - name: Rust unit tests
        run: cargo test -p wickra-screener-c
      # The generated header is platform-independent, so checking drift on one OS
      # is enough — and avoids a spurious CRLF/LF diff on the Windows runner. This
      # also validates the vendored Go copy.
      - name: Check the C header (cbindgen + Go copy) is in sync
        if: runner.os == 'Linux'
        shell: bash
        run: bash .github/scripts/check-cbindgen.sh
      # The real cross-language test: a foreign C consumer links the generated
      # header + the compiled library and runs. If this passes on all three OSes,
      # every C-capable language can link the same way.
      - name: Build and run the C example (CMake + ctest)
        shell: bash
        run: |
          cmake -S examples/c -B examples/c/build
          cmake --build examples/c/build --config Release
          ctest --test-dir examples/c/build -C Release --output-on-failure

  go:
    name: Go on ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "stable"
          cache: false
      - uses: ./.github/actions/setup-rust
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - name: Build the C ABI library
        run: cargo build -p wickra-screener-c --release
      - name: Vendored header in sync with the C ABI
        shell: bash
        run: |
          if ! diff -u bindings/c/include/wickra_screener.h bindings/go/include/wickra_screener.h; then
            echo "::error::bindings/go/include/wickra_screener.h is stale — copy bindings/c/include/wickra_screener.h over it"
            exit 1
          fi
      - name: Stage the native library
        shell: bash
        run: |
          case "$RUNNER_ARCH" in
            X64) arch=amd64 ;;
            ARM64) arch=arm64 ;;
            *) echo "::error::unsupported RUNNER_ARCH '$RUNNER_ARCH'"; exit 1 ;;
          esac
          case "$RUNNER_OS" in
            Linux)   dir="linux_$arch";   lib=target/release/libwickra_screener.so ;;
            macOS)   dir="darwin_$arch";  lib=target/release/libwickra_screener.dylib ;;
            Windows) dir="windows_$arch"; lib=target/release/wickra_screener.dll ;;
          esac
          mkdir -p "bindings/go/lib/$dir"
          cp "$lib" "bindings/go/lib/$dir/"
          echo "WICKRA_GO_LIBDIR=$PWD/bindings/go/lib/$dir" >> "$GITHUB_ENV"
      - name: Check gofmt
        shell: bash
        run: |
          unformatted="$(gofmt -l bindings/go)"
          if [ -n "$unformatted" ]; then
            echo "gofmt needed on:"; echo "$unformatted"; exit 1
          fi
      - name: Vet and test the Go binding
        shell: bash
        run: |
          export PATH="$WICKRA_GO_LIBDIR:$PATH"
          cd bindings/go
          go vet ./...
          go test ./...

  csharp:
    name: C# on ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-rust
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: "8.0"
      # The test project copies the native library from target/release (see the
      # <Content> items), so build it in the release profile here.
      - name: Build the C ABI library
        run: cargo build -p wickra-screener-c --release
      - name: Test the C# binding
        run: dotnet test bindings/csharp/WickraScreener.Tests/WickraScreener.Tests.csproj -c Release

  java:
    name: Java on ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-rust
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      # The pom points native.lib.dir at target/debug, so build the debug profile.
      - name: Build the C ABI library
        run: cargo build -p wickra-screener-c
      - uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6.0.0
        with:
          distribution: temurin
          java-version: "25"
          cache: maven
      - name: Test the Java binding
        run: mvn -B -f bindings/java test

  r:
    name: R on ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    env:
      WKSCREEN_INC: ${{ github.workspace }}/bindings/c/include
      WKSCREEN_LIB: ${{ github.workspace }}/target/release
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-rust
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - name: Build the C ABI library
        run: cargo build -p wickra-screener-c --release
      - uses: r-lib/actions/setup-r@465b7d8e732ca3921382b1674c59bada9cbf3399 # v2.13.0
        with:
          r-version: "release"
          use-public-rspm: true
      - name: Install and test the R binding
        shell: bash
        # github.workspace is a backslash path on Windows; Makevars(.win) (sh) and
        # mingw need forward slashes. The Makevars do not bake an rpath, so the
        # native library must be on the loader path at run time.
        run: |
          export WKSCREEN_INC="${WKSCREEN_INC//\\//}"
          export WKSCREEN_LIB="${WKSCREEN_LIB//\\//}"
          if command -v cygpath >/dev/null 2>&1; then
            WKSCREEN_LIB_UNIX=$(cygpath -u "$WKSCREEN_LIB")
            export PATH="$WKSCREEN_LIB_UNIX:$PATH"
          else
            export LD_LIBRARY_PATH="$WKSCREEN_LIB:$LD_LIBRARY_PATH"
            export DYLD_LIBRARY_PATH="$WKSCREEN_LIB:$DYLD_LIBRARY_PATH"
          fi
          R CMD INSTALL bindings/r
          Rscript bindings/r/tests/run_tests.R
