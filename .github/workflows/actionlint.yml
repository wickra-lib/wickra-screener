name: actionlint

# Static analysis of the workflow files as workflows: unknown keys, bad
# `runs-on` labels, expressions that cannot evaluate, shell syntax inside `run`
# blocks. zizmor covers the security surface of the same files; this covers
# whether they are valid at all.
#
# A workflow that is merely wrong rather than insecure fails at dispatch time,
# which on the release workflow means finding out at the tag.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

env:
  # Pinned by version and verified by checksum. actionlint is not published as a
  # GitHub Action, and `taiki-e/install-action` does not carry it, so the release
  # binary is fetched directly -- which is fine as long as what arrives is
  # checked against what was expected.
  ACTIONLINT_VERSION: "1.7.12"
  ACTIONLINT_SHA256: "8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8"

jobs:
  actionlint:
    name: Lint workflows
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install actionlint
        shell: bash
        run: |
          set -euo pipefail
          archive="actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          url="https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/${archive}"
          curl --retry 5 --retry-delay 5 --fail --silent --show-error --location \
            --output "$archive" "$url"
          echo "${ACTIONLINT_SHA256}  ${archive}" | sha256sum --check --status
          tar -xzf "$archive" actionlint
          install -m 0755 actionlint /usr/local/bin/actionlint
          actionlint --version
          rm -f "$archive" actionlint

      # actionlint shells out to shellcheck for `run:` blocks when it is
      # present; the ubuntu runner ships it, so this needs no install step.
      - name: Run actionlint
        run: actionlint -color
