name: wickra-screener CodeQL configuration

# What CodeQL should not spend a pass on, and why.
#
# Without this every generated or vendored file under a binding is analysed as
# if it were hand-written source, and each new binding class arrives as a fresh
# batch of findings about code nobody wrote.
paths-ignore:
  # Generated by `napi build` and committed so the package can be published
  # without a build step. Regenerating them is the fix for anything found here.
  - bindings/node/index.js
  - bindings/node/index.d.ts
  # A vendored copy of the C ABI header, kept in sync by
  # .github/scripts/check-cbindgen.sh rather than edited.
  - bindings/go/include
  # Fixtures, not code: the committed universes and expected reports.
  - golden
  # Build output and dependency trees.
  - target
  - "**/node_modules"

# The examples are deliberately small and skip the error handling a library
# would need, so the query packs that reward defensive code produce noise there
# rather than findings. They are still compiled and run by CI.
paths:
  - bindings
  - crates
  - fuzz
