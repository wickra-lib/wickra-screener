# OSV-Scanner suppressions (VEX record). Consumed by OSV-Scanner and the
# OpenSSF Scorecard Vulnerabilities check. Each entry is an advisory assessed as
# not affecting wickra-screener; this mirrors the cargo-deny `ignore` list in
# deny.toml at the OSV layer.
#
# Keep in lock-step with deny.toml's [advisories].ignore.
#
# Note on the difference between the two scanners: cargo-deny resolves the
# feature graph and reports what a build actually links, while OSV-Scanner reads
# `Cargo.lock`, which records the union of every optional dependency. An advisory
# that cargo-deny is silent about and OSV-Scanner reports is usually that
# difference, and it belongs here with the reasoning rather than being silenced
# by loosening the scan.

