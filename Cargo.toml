# Wickra Screener — workspace.
# A parallel multi-symbol screener built as one data-driven core
# (`screener-core`): a serde condition tree (ScanSpec) is folded over each
# symbol's history with 497 O(1) streaming indicators, evaluated per bar, and
# scanned in parallel (rayon) or sequentially (the WASM fallback), byte-for-byte
# identical. The core is exposed as a JSON-over-C-ABI data API in ten languages,
# mirroring the Wickra tiering: Rust core -> native Python/Node/WASM + a C ABI
# hub for C/C++/C#/Go/Java/R.
#
# The `members` list grows as crates are added, phase by phase; the final set is:
#   crates/screener-core, crates/screener-cli, crates/screener-bench,
#   bindings/c, bindings/python, bindings/node, bindings/wasm

[workspace]
resolver = "2"
members = ["crates/screener-core", "crates/screener-cli", "crates/screener-bench", "bindings/c", "bindings/python", "bindings/node", "bindings/wasm", "examples/rust"]
# The fuzz crate is its own (detached) workspace — cargo-fuzz builds it on a
# nightly toolchain with sanitizer flags.
exclude = ["fuzz"]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.86"
license = "MIT OR Apache-2.0"
authors = ["wickra-lib"]
repository = "https://github.com/wickra-lib/wickra-screener"
homepage = "https://wickra.org"
readme = "README.md"
keywords = ["trading", "screener", "indicators", "streaming", "finance"]
categories = ["finance", "command-line-utilities"]

[workspace.dependencies]
# Wickra ecosystem, all of it from crates.io.
# Held at the same major as the copy `wickra-backtest-core` resolves, so the
# tree carries one `wickra-core` and one set of indicator types rather than two
# incompatible ones.
wickra-core = "1.0"
wickra-data = "1.0"
# The exchange facade, used only by the optional `live` universe feature. It was
# consumed from a git rev until its first crates.io release; that release is out,
# so the pin is a plain version. A release of this repository could not have been
# published while it stood: `cargo publish` resolves the registry version, not
# the rev, so the crate that shipped would not have been the crate that was
# tested.
wickra-exchange = "0.1.1"
# The only name -> indicator registry in the ecosystem: the backtester's factory
# resolves an indicator by name + params into an object-safe EvalIndicator, and
# `registry::feed_of` reports which feed family that indicator consumes. Now on
# crates.io, so the screener no longer carries a git dependency for it.
wickra-backtest-core = "0.1.2"
# Workspace-internal crate, referenced by the CLI, bench and bindings.
screener-core = { version = "0.1.0", path = "crates/screener-core" }
# Serialization — the data-driven boundary (spec/command/report as JSON).
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "1.1"
# Exact decimal arithmetic where price/qty precision matters.
rust_decimal = { version = "1", features = ["serde"] }
thiserror = "2"
# Data-parallel scan across symbols.
rayon = "1"
clap = { version = "4", features = ["derive"] }
# C ABI header generation.
cbindgen = "0.27"
# Test/dev.
criterion = { package = "codspeed-criterion-compat", version = "5.0.1", features = ["html_reports"] }
proptest = "1"

[workspace.lints.rust]
# The core and all bindings are safe Rust; the C ABI hub re-allows unsafe
# locally (it must call across the FFI boundary).
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
# Allowed pedantic lints (same precedent as the wickra core).
cast_precision_loss = "allow"
cast_sign_loss = "allow"
cast_possible_truncation = "allow"
module_name_repetitions = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
must_use_candidate = "allow"
too_many_lines = "allow"
similar_names = "allow"

[profile.release]
# Panics must never unwind across the C ABI boundary: abort instead.
lto = true
codegen-units = 1
panic = "abort"
strip = true
