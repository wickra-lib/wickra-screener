# cargo-deny configuration — supply-chain gate (advisories, licenses, bans, sources).

[graph]
# Scan the feature-expanded graph, not just the default one. Without this the
# gate reads a narrower dependency set than the repository ships: the exchange
# tree arrives under the optional `live` universe feature, so cargo-deny never
# reached it, and two crates crates.io had yanked -- `chacha20` and `wnaf`, both
# below `p256` in that tree -- sat in `Cargo.lock` while the job reported ok.
#
# The `webpki-roots` licence exception further down is the same story from the
# other side: its own comment says it exists for the `live` tree, which means it
# was never evaluated either. An exception nothing reaches is not policy, and a
# clean result from a filter that matched nothing is not a proof.
all-features = true

[advisories]
version = 2
yanked = "deny"
# Suppressed advisories (assessed as not affecting wickra-screener). Keep in
# lock-step with osv-scanner.toml.
ignore = []

[licenses]
version = 2
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-3.0",
    "Zlib",
    "MPL-2.0",
]
confidence-threshold = 0.93

# Scoped license exceptions for individual permissive / public-domain crates:
#   - webpki-roots (CDLA-Permissive-2.0): the Mozilla CA certificate bundle as
#     data, pulled in transitively by the exchange's rustls TLS stack (only
#     under the optional `live` universe feature).
exceptions = [
    { allow = ["CDLA-Permissive-2.0"], crate = "webpki-roots" },
]

[bans]
# A duplicated crate is an error, not a note. The case this exists for: a
# `napi-derive-backend` bump pulled a second `convert_case` while the macro crate
# beside it still used the first, and the two versions' types are not the same
# type -- so `napi-derive` stopped compiling on every platform at once. As a
# warning that read as normal output; as an error it stops at the lockfile.
#
# The skips below are the two duplicates that are not a mistake: each is a crate
# part-way through a major release, reached through two ecosystems that have not
# both moved yet. They are named rather than left to a blanket allowance so that
# a third duplicate still fails.
multiple-versions = "deny"
skip = [
    # `rand` 0.9 pulls getrandom 0.3; the wasm and pyo3 side pull 0.4.
    { crate = "getrandom" },
    # proc-macro crates are mid-migration from syn 2 to syn 3.
    { crate = "syn" },
    # `wickra-exchange` reaches `tokio-tungstenite` 0.30, which still pins
    # webpki-roots 0.26 while the rest of the graph is on 1.x. Upstream, and it
    # does not go away by moving this repository's own pins -- checked by taking
    # `wickra-exchange` from 0.1.1 to 0.1.3, which changed nothing here.
    { crate = "webpki-roots" },
    # The Windows API bindings ship a new major roughly yearly and half the
    # ecosystem is always one behind; nothing in this workspace chooses it.
    { crate = "windows-sys" },
    # A UEFI target shim reached through getrandom, already skipped above for
    # the same reason.
    { crate = "r-efi" },
]
wildcards = "deny"

[sources]
unknown-registry = "deny"
unknown-git = "deny"

# The exchange facade is consumed as a git dependency until its first crates.io
# release; it lives under the project's own GitHub org.
[sources.allow-org]
github = ["wickra-lib"]
