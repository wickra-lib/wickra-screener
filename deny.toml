# cargo-deny configuration — supply-chain gate (advisories, licenses, bans, sources).

[graph]
# Scan the feature-expanded graph, not just the default one. Without this the
# gate reads a narrower dependency set than the repository ships: the exchange
# tree arrives under the optional `live` universe feature, so cargo-deny never
# reached it, and two crates crates.io had yanked -- `chacha20` and `wnaf`, both
# below `p256` in that tree -- sat in `Cargo.lock` while the job reported ok.
#
# The `webpki-roots` licence exception further down is the same story from the
# other side: its own comment says it exists for the `live` tree, which means it
# was never evaluated either. An exception nothing reaches is not policy, and a
# clean result from a filter that matched nothing is not a proof.
all-features = true

[advisories]
version = 2
yanked = "deny"
# Suppressed advisories (assessed as not affecting wickra-screener). Keep in
# lock-step with osv-scanner.toml.
ignore = []

[licenses]
version = 2
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-3.0",
    "Zlib",
    "MPL-2.0",
]
confidence-threshold = 0.93

# Scoped license exceptions for individual permissive / public-domain crates:
#   - webpki-roots (CDLA-Permissive-2.0): the Mozilla CA certificate bundle as
#     data, pulled in transitively by the exchange's rustls TLS stack (only
#     under the optional `live` universe feature).
exceptions = [
    { allow = ["CDLA-Permissive-2.0"], crate = "webpki-roots" },
]

[bans]
multiple-versions = "warn"
wildcards = "deny"

[sources]
unknown-registry = "deny"
unknown-git = "deny"

# The exchange facade is consumed as a git dependency until its first crates.io
# release; it lives under the project's own GitHub org.
[sources.allow-org]
github = ["wickra-lib"]
