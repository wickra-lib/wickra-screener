# Configuration for the lychee link checker (used by the links CI workflow).

# Treat these as success in addition to 2xx.
accept = [200, 206, 429]

# Retry transient failures.
max_retries = 3
retry_wait_time = 2

# Don't hammer hosts.
max_concurrency = 8


# Exclude links that are not meant to resolve at check time: localhost,
# example/placeholder hosts, and the package-registry URLs that 404 until a
# release is published.
#
# The changelog's version-compare links are the same class, and unlike the
# registry URLs they do not stop 404ing after the first release: they point at
# the tag being prepared, which is created *after* the release PR is merged.
# The link check runs on push and pull_request and never on the tag, so every
# future release PR would carry the same two red links. One pattern covers all
# of them.
exclude = [
    "^https?://localhost",
    "^https?://127\\.0\\.0\\.1",
    "example\\.com",
    "^https?://crates\\.io/crates/wickra-screener",
    "^https?://pypi\\.org/project/wickra-screener",
    "^https?://www\\.npmjs\\.com/package/wickra-screener",
    "^https?://pkg\\.go\\.dev/github\\.com/wickra-lib/wickra-screener-go",
    "^https?://www\\.nuget\\.org/packages/Wickra\\.Screener",
    "^https?://central\\.sonatype\\.com/artifact/org\\.wickra/wickra-screener",
    "github\\.com/wickra-lib/wickra-screener/compare/",
]

# Directories that hold markdown which is not ours to check: dependency trees,
# build output and tool caches. Needed once the scan widened from a hand-listed
# pair of globs to the whole tree.
exclude_path = [
    "node_modules",
    "target",
    ".venv",
    "__pycache__",
    ".pytest_cache",
    "bin",
    "obj",
]
