[package]
name = "screener-core"
description = "Data-driven core of the Wickra screener: a serde ScanSpec condition tree folded over a symbol universe with 497 O(1) streaming indicators."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
readme.workspace = true
keywords.workspace = true
categories.workspace = true

[package.metadata.docs.rs]
# Document every feature, including `live`, so the exchange-sourced universe is
# not missing from the reference. docs.rs builds on nightly and sets the
# `docsrs` cfg, which is what makes the feature badges appear.
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[lints]
workspace = true

[features]
# `parallel` scans symbols concurrently with rayon; it is on by default. The
# wasm binding builds with --no-default-features for a sequential scan that is
# byte-identical to the parallel one. `live` pulls the exchange facade to source
# a live symbol universe (native-only).
default = ["parallel"]
parallel = ["dep:rayon"]
live = ["dep:wickra-exchange"]

[dependencies]
# Streaming indicators resolved by name + params via the registry factory (the
# only name -> indicator resolver in the ecosystem, and what decides that 497 of
# the library's indicators are reachable from a scan); it pulls in wickra-core
# transitively.
wickra-backtest-core.workspace = true
wickra-core.workspace = true
serde.workspace = true
serde_json.workspace = true
toml.workspace = true
rust_decimal.workspace = true
thiserror.workspace = true
# Data-parallel scan across symbols; optional (the `parallel` feature).
rayon = { workspace = true, optional = true }
# The native exchange facade for a live symbol universe; optional (`live`).
wickra-exchange = { workspace = true, optional = true }

[dev-dependencies]
proptest.workspace = true
serde.workspace = true
serde_json.workspace = true
