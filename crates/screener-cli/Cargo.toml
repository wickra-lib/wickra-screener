[package]
name = "wickra-screener"
description = "Reference command-line screener over the Wickra wickra-screener-core: load a spec and a universe of CSV candle files, run a scan, print the report."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
readme.workspace = true
keywords.workspace = true
categories.workspace = true

[package.metadata.docs.rs]
# Document every feature, including `live`, so the exchange-sourced universe is
# not missing from the reference. docs.rs builds on nightly and sets the
# `docsrs` cfg, which is what makes the feature badges appear.
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[lints]
workspace = true

[[bin]]
name = "wickra-screener"
path = "src/main.rs"

[features]
# Source the universe from an exchange instead of from files. Native only, and
# read-only: the binary sends no key and places no order.
live = ["wickra-screener-core/live"]

[dependencies]
# The data-driven scan core.
wickra-screener-core.workspace = true
# Reads the `<SYMBOL>.csv` universe. The ecosystem's own OHLCV CSV reader:
# validates the header, strips a leading UTF-8 BOM (spreadsheet exports carry
# one) and checks the OHLC invariants, none of which the hand-rolled parser here
# used to do.
wickra-data.workspace = true
serde_json.workspace = true
clap.workspace = true
